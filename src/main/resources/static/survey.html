<!DOCTYPE html>
<html lang="en">
<head>
    <title>Survey</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7fa;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .survey-card {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .question {
            margin-bottom: 20px;
        }
        .question label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #34495e;
        }
        .options {
            margin-left: 20px;
            margin-right: 20px;
        }
        .option-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .option-item input[type="radio"],
        .option-item input[type="checkbox"] {
            margin-right: 10px;
            accent-color: #3498db;
        }
        .option-item label {
            margin: 0;
            font-weight: normal;
            color: #333;
        }
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            resize: vertical;
            min-height: 100px;
        }
        button {
            display: block;
            width: 200px;
            margin: 20px auto;
            background-color: #3498db;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .error {
            color: #e74c3c;
            text-align: center;
            margin-top: 10px;
        }
        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }
            .survey-card {
                padding: 15px;
            }
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="surveyTitle"></h1>
        <div class="survey-card">
            <form id="surveyForm"></form>
            <button onclick="submitSurvey()">Submit</button>
            <div id="error" class="error"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const surveyName = urlParams.get('name');

        if (!surveyName) {
            document.getElementById('error').innerText = 'No survey name provided';
        } else {
            fetch(`/api/survey/${surveyName}`)
                .then(response => response.json())
                .then(survey => {
                    document.getElementById('surveyTitle').innerText = survey.name;
                    const form = document.getElementById('surveyForm');
                    survey.questions.forEach((question, index) => {
                        const div = document.createElement('div');
                        div.className = 'question';
                        div.innerHTML = `<label>${question.text} ${question.required ? '<span style="color:#e74c3c">*</span>' : ''}</label>`;
                        const optionsDiv = document.createElement('div');
                        optionsDiv.className = 'options';

                        if (question.type === 'open') {
                            optionsDiv.innerHTML = `<textarea name="q${index}" ${question.required ? 'required' : ''}></textarea>`;
                        } else if (question.type === 'single') {
                            question.options.forEach(option => {
                                const optionDiv = document.createElement('div');
                                optionDiv.className = 'option-item';
                                optionDiv.innerHTML = `
                                    <input type="radio" name="q${index}" value="${option}" ${question.required ? 'required' : ''}>
                                    <label>${option}</label>
                                `;
                                optionsDiv.appendChild(optionDiv);
                            });
                        } else if (question.type === 'multiple') {
                            question.options.forEach(option => {
                                const optionDiv = document.createElement('div');
                                optionDiv.className = 'option-item';
                                optionDiv.innerHTML = `
                                    <input type="checkbox" name="q${index}" value="${option}">
                                    <label>${option}</label>
                                `;
                                optionsDiv.appendChild(optionDiv);
                            });
                        }
                        div.appendChild(optionsDiv);
                        form.appendChild(div);
                    });
                })
                .catch(error => {
                    document.getElementById('error').innerText = 'Error loading survey: ' + error;
                });
        }

        function submitSurvey() {
            const form = document.getElementById('surveyForm');
            const errorDiv = document.getElementById('error');
            errorDiv.innerText = '';

            fetch(`/api/survey/${surveyName}`)
                .then(response => response.json())
                .then(survey => {
                    const answers = [];
                    survey.questions.forEach((question, index) => {
                        const inputs = form.querySelectorAll(`[name="q${index}"]`);
                        const values = [];

                        if (question.type === 'open') {
                            values.push(inputs[0].value);
                        } else if (question.type === 'single') {
                            inputs.forEach(input => {
                                if (input.checked) values.push(input.value);
                            });
                        } else if (question.type === 'multiple') {
                            inputs.forEach(input => {
                                if (input.checked) values.push(input.value);
                            });
                        }

                        if (question.required && values.length === 0) {
                            errorDiv.innerText = `Please answer required question: ${question.text}`;
                            throw new Error('Validation failed');
                        }

                        answers.push({ questionText: question.text, values });
                    });

                    const response = { surveyName, answers };
                    return fetch('/api/response', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(response)
                    });
                })
                .then(response => response.text())
                .then(() => {
                    window.location.href = '/thankyou.html';
                })
                .catch(error => {
                    if (error.message !== 'Validation failed') {
                        errorDiv.innerText = 'Error submitting survey: ' + error;
                    }
                });
        }
    </script>
</body>
</html>
